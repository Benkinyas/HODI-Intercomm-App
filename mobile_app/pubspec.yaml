name: hodi_mobile
description: "HODI - Urgent Workplace Paging System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_auth: ^4.16.0
  cloud_functions: ^4.6.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.2.0
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^9.1.1
  path_provider: ^2.1.2
  open_filex: ^4.3.4
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
